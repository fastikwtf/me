<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рома — StaticGram</title>
  <meta name="description" content="Рома (Shade) — пользователь StaticGram, разработчик ботов. Музыка, Telegram, StaticGram.">
  <style>
    :root {
      --bg: #000000;
      --card: rgba(20, 20, 25, 0.7);
      --card-hover: rgba(40, 40, 45, 0.9);
      --text: #ffffff;
      --muted: #888888;
      --accent: #ffffff;
      --border: #333333;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      /* Градиент черный - серый - черный */
      background: linear-gradient(135deg, #000000 0%, #2a2a2a 50%, #000000 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Запрет на прокрутку */
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 2rem;
      display: flex;
      gap: 4rem;
      align-items: center;
    }

    /* Левая колонка (Аватарка) */
    .left-col {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .avatar {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
    }

    /* Правая колонка (Инфа, Музыка, Ссылки) */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-width: 0;
    }

    /* Заголовки */
    h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -.02em; }
    .subtitle { color: var(--muted); font-size: 1.1rem; margin-top: 0.2rem; }

    /* Обо мне */
    .about-row {
      display: flex;
      justify-content: space-between;
      padding: .4rem 0;
      border-bottom: 1px solid var(--border);
      font-size: .95rem;
    }
    .about-row:last-child { border-bottom: none; }
    .about-row span:first-child { color: var(--muted); }
    .about-row span:last-child { font-weight: 500; text-align: right; }

    /* Музыка */
    .music-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(10px);
    }
    .music-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }
    .music-icon {
      width: 36px; height: 36px;
      background: #ffffff;
      color: #000;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .music-title { font-weight: 600; font-size: 1rem; }
    .music-desc { color: var(--muted); font-size: .8rem; }
    
    /* Темный плеер */
    audio {
      width: 100%;
      height: 40px;
      outline: none;
      border-radius: 8px;
      /* Инвертируем цвета стандартного плеера, чтобы он стал черным */
      filter: invert(100%) hue-rotate(180deg) brightness(1.5);
    }

    /* Ссылки */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      text-decoration: none;
      color: var(--text);
      transition: all .2s ease;
      backdrop-filter: blur(10px);
    }
    .link:hover {
      background: var(--card-hover);
      border-color: #555;
      transform: translateX(4px);
    }
    .link-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .link-body { flex: 1; min-width: 0; }
    .link-title { font-weight: 600; font-size: 0.95rem; }
    .link-desc { color: var(--muted); font-size: .8rem; margin-top: 0.1rem; }
    .link-arrow { color: var(--muted); }

    /* Адаптивность для телефонов (если кто-то зайдет с мобилки) */
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; padding: 2rem 0; }
      .container { flex-direction: column; gap: 2rem; padding: 1rem; }
      .avatar { width: 200px; height: 200px; }
      .right-col { width: 100%; }
      h1 { font-size: 2rem; text-align: center; }
      .subtitle { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Левая часть: Аватарка -->
    <div class="left-col">
      <!-- Не забудь закинуть файл avatar.jpg в репозиторий! -->
      <img class="avatar" src="avatar.jpg" alt="Аватарка">
    </div>

    <!-- Правая часть: Инфа, Музыка, Ссылки -->
    <div class="right-col">
      
      <!-- Инфа -->
      <div>
        <h1>Рома</h1>
        <p class="subtitle">Пользователь StaticGram · Shade</p>

      <div>

        <div class="about-row"><span>Возраст</span><span>??</span></div>
        <div class="about-row"><span>Занятие</span><span>Разработчик ботов</span></div>
        <div class="about-row"><span>В Telegram</span><span>! wdie</span></div>
        <div class="about-row"><span>В StaticGram</span><span>Shade</span></div>

      <!-- Музыка -->
      <div class="music-card">

          <source src="music.mp3" type="audio/mpeg">

      </div>

      <!-- Ссылки -->
      <div class="links">
        <a class="link" href="https://t.me/gsgojo" target="_blank" rel="noopener">
          <div class="link-icon">✈️</div>
          <div class="link-body">
            <div class="link-title">Telegram</div>
            <div class="link-desc">! wdie · @gsgojo</div>
          </div>
          <div class="link-arrow">→</div>
        </a>

        <a class="link" href="https://t.me/kzroz" target="_blank" rel="noopener">
          <div class="link-icon">📢</div>
          <div class="link-body">
            <div class="link-title">Telegram-канал</div>
            <div class="link-desc">@kzroz</div>
          </div>
          <div class="link-arrow">→</div>
        </a>

        <a class="link" href="https://t.me/staticgrams" target="_blank" rel="noopener">
          <div class="link-icon">⚡</div>
          <div class="link-body">
            <div class="link-title">StaticGram</div>
            <div class="link-desc">@staticgrams</div>
          </div>
          <div class="link-arrow">→</div>
        </a>

        <a class="link" href="https://staticgram.top/chain" target="_blank" rel="noopener">
          <div class="link-icon">👤</div>
          <div class="link-body">
            <div class="link-title">Я в StaticGram</div>
            <div class="link-desc">Shade · staticgram.top/chain</div>
          </div>
          <div class="link-arrow">→</div>
        </a>
      </div>

    </div>
  </div>
</body>
</html>
